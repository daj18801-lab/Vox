name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Wrap Firebase web folder & build APK
        run: |
          WEB_DIR=$(grep -o '"public"[[:space:]]*:[[:space:]]*"[^"]*"' firebase.json | head -n 1 | cut -d'"' -f4)
          WEB_DIR=${WEB_DIR:-public}
          echo "Using web directory: $WEB_DIR"
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Vox" "com.example.vox" --web-dir="$WEB_DIR"
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
